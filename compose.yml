version: "3.8"
services:
  go:
    container_name: go
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    env_file:
      - ./backend/.env
    tty: true
    ports:
      - 8989:8989
    volumes:
      - type: bind
        source: ./
        target: /usr/local
    networks:
      - supabase_network_backend
networks:
  supabase_network_backend:
    external: true
